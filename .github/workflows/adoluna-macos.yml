# Adoluna Support - macOS universal (arm64 + x86_64) dmg. Derived from RustDesk 1.5.0 flutter-build.yml.
# Manual trigger only, no release upload. Developer ID signed + notarized (required).
# Secrets: MACOS_P12_BASE64, MACOS_P12_PASSWORD, APPLE_ID, APPLE_APP_PASSWORD, APPLE_TEAM_ID
name: adoluna-macos

on:
  workflow_dispatch:

env:
  VERSION: "1.5.0"
  RUST_VERSION: "1.75"
  MAC_RUST_VERSION: "1.81"
  CARGO_EXPAND_VERSION: "1.0.95"
  FLUTTER_RUST_BRIDGE_VERSION: "1.80.1"
  BRIDGE_FLUTTER_VERSION: "3.22.3"
  FLUTTER_VERSION: "3.24.5"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  APP: "AdolunaSupport.app"

jobs:
  notary-check:
    runs-on: macos-15
    steps:
      - name: Verify notarytool credentials before the long build
        env:
          AID: ${{ secrets.APPLE_ID }}
          APW: ${{ secrets.APPLE_APP_PASSWORD }}
          TID: ${{ secrets.APPLE_TEAM_ID }}
        run: xcrun notarytool history --apple-id "$AID" --password "$APW" --team-id "$TID" | head -20

  bridge:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive
      - run: |
          sudo apt-get update -y
          sudo apt-get install -y clang cmake curl gcc git g++ libclang-dev libgtk-3-dev llvm-dev nasm ninja-build pkg-config wget
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: "rustfmt"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ env.BRIDGE_FLUTTER_VERSION }}
          cache: true
      - run: |
          cargo install cargo-expand --version ${{ env.CARGO_EXPAND_VERSION }} --locked
          cargo install flutter_rust_bridge_codegen --version ${{ env.FLUTTER_RUST_BRIDGE_VERSION }} --features "uuid" --locked
          sed -i -e 's/extended_text: 14.0.0/extended_text: 13.0.0/g' flutter/pubspec.yaml
          pushd flutter && flutter pub get && popd
          ~/.cargo/bin/flutter_rust_bridge_codegen --rust-input ./src/flutter_ffi.rs --dart-output ./flutter/lib/generated_bridge.dart --c-output ./flutter/macos/Runner/bridge_generated.h
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bridge-artifact
          path: |
            ./src/bridge_generated.rs
            ./src/bridge_generated.io.rs
            ./flutter/lib/generated_bridge.dart
            ./flutter/lib/generated_bridge.freezed.dart
            ./flutter/macos/Runner/bridge_generated.h

  build:
    needs: [bridge, notary-check]
    strategy:
      fail-fast: true
      matrix:
        job:
          - { target: x86_64-apple-darwin, os: macos-15-intel, arch: x86_64, extra: "" }
          - { target: aarch64-apple-darwin, os: macos-15, arch: aarch64, extra: "--screencapturekit" }
    runs-on: ${{ matrix.job.os }}
    steps:
      - uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive
      - name: Install build runtime
        run: |
          brew install llvm
          command -v pkg-config || brew install pkg-config
          wget -q https://www.nasm.us/pub/nasm/releasebuilds/2.16.03/macosx/nasm-2.16.03-macosx.zip
          unzip -q nasm-2.16.03-macosx.zip && sudo cp nasm-2.16.03/nasm /usr/local/bin/nasm
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - name: Patch flutter
        run: |
          cd $(dirname $(dirname $(which flutter)))
          git apply ${{ github.workspace }}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff
          cd bin
          sed -i -e 's/_setFramesEnabledState(false);/\/\/_setFramesEnabledState(false);/g' ../packages/flutter/lib/src/scheduler/binding.dart
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.MAC_RUST_VERSION }}
          targets: ${{ matrix.job.target }}
          components: "rustfmt"
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: ${{ matrix.job.os }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./
      - uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false
      - name: Install vcpkg dependencies
        run: $VCPKG_ROOT/vcpkg install --x-install-root="$VCPKG_ROOT/installed"
      - name: Prefetch flutter packages (retry on network stall)
        timeout-minutes: 20
        run: |
          cd flutter
          for i in 1 2 3 4; do
            if perl -e 'alarm 240; exec @ARGV' flutter pub get; then exit 0; fi
            echo "pub get attempt $i failed/stalled, retrying"; sleep 15
          done
          exit 1
      - name: Build
        timeout-minutes: 120
        env:
          CARGO_NET_RETRY: "10"
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
        run: |
          # Same minimum version on both slices so the universal app has one LSMinimumSystemVersion.
          MIN_MACOS_VERSION="12.3"
          sed -i -e "s/MACOSX_DEPLOYMENT_TARGET\=[0-9]*.[0-9]*/MACOSX_DEPLOYMENT_TARGET=${MIN_MACOS_VERSION}/" build.py
          sed -i -e "s/platform :osx, '.*'/platform :osx, '${MIN_MACOS_VERSION}'/" flutter/macos/Podfile
          sed -i -e "s/osx_minimum_system_version = \"[0-9]*.[0-9]*\"/osx_minimum_system_version = \"${MIN_MACOS_VERSION}\"/" Cargo.toml
          sed -i -e "s/MACOSX_DEPLOYMENT_TARGET = [0-9]*.[0-9]*;/MACOSX_DEPLOYMENT_TARGET = ${MIN_MACOS_VERSION};/" flutter/macos/Runner.xcodeproj/project.pbxproj
          ./build.py --flutter --hwcodec --unix-file-copy-paste ${{ matrix.job.extra }}
          cd flutter/build/macos/Build/Products/Release
          ditto -c -k --keepParent "${APP}" ${{ github.workspace }}/app-${{ matrix.job.arch }}.zip
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-${{ matrix.job.arch }}
          path: app-${{ matrix.job.arch }}.zip

  universal:
    needs: build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: app-*
          merge-multiple: true
      - name: Merge into universal app (lipo every Mach-O that differs)
        run: |
          mkdir arm x64
          ditto -x -k app-aarch64.zip arm && ditto -x -k app-x86_64.zip x64
          cp -R "arm/${APP}" "${APP}"
          cd x64
          find "${APP}" -type f | while read -r f; do
            if file -b "$f" | grep -q 'Mach-O' && [ -f "../arm/$f" ]; then
              if ! lipo "../arm/$f" -verify_arch x86_64 2>/dev/null; then
                lipo -create "../arm/$f" "$f" -output "../$f"
              fi
            fi
          done
          cd ..
          lipo -info "${APP}/Contents/MacOS/AdolunaSupport" "${APP}/Contents/Frameworks/liblibrustdesk.dylib" || true
          # Adoluna: Finder/Dock/Launchpad show "Adoluna Support" while the bundle path stays AdolunaSupport.app
          for l in en zh-Hans zh_CN Base; do
            mkdir -p "${APP}/Contents/Resources/${l}.lproj"
            printf '"CFBundleDisplayName" = "Adoluna Support";\n"CFBundleName" = "Adoluna Support";\n' > "${APP}/Contents/Resources/${l}.lproj/InfoPlist.strings"
          done
          /usr/libexec/PlistBuddy -c "Print :CFBundleName" -c "Print :CFBundleDisplayName" -c "Print :LSHasLocalizedDisplayName" "${APP}/Contents/Info.plist" || true
      - name: Import Developer ID certificate (temp keychain)
        env:
          P12: ${{ secrets.MACOS_P12_BASE64 }}
          P12_PW: ${{ secrets.MACOS_P12_PASSWORD }}
        run: |
          test -n "$P12" || { echo "MACOS_P12_BASE64 secret missing"; exit 1; }
          KC="$RUNNER_TEMP/adoluna.keychain-db"; KPW=$(openssl rand -hex 24)
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KPW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KPW" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PW" -A -t cert -f pkcs12 -k "$KC"
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KPW" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          IDENTITY=$(security find-identity -v -p codesigning "$KC" | grep -m1 "Developer ID Application" | sed -E 's/.*"(.*)"/\1/')
          test -n "$IDENTITY" || { echo "No Developer ID Application identity"; exit 1; }
          echo "Signing with: $IDENTITY"
          echo "IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
      - name: Check notarytool credentials
        env:
          AID: ${{ secrets.APPLE_ID }}
          APW: ${{ secrets.APPLE_APP_PASSWORD }}
          TID: ${{ secrets.APPLE_TEAM_ID }}
        run: xcrun notarytool history --apple-id "$AID" --password "$APW" --team-id "$TID" | head -20
      - name: Codesign app (inside-out, hardened runtime)
        run: |
          xattr -cr "${APP}"
          # any extra Mach-O under MacOS/ or Resources/ (helpers) first
          find "${APP}/Contents/MacOS" "${APP}/Contents/Resources" -type f ! -path "*/Contents/MacOS/AdolunaSupport" -print0 | while IFS= read -r -d '' f; do
            if file -b "$f" | grep -q 'Mach-O'; then codesign --force --options runtime --timestamp --sign "$IDENTITY" "$f"; fi
          done
          bash ./.github/scripts/sign-macos-app.sh "${APP}" "$IDENTITY" ./flutter/macos/Runner/Release.entitlements
          codesign -dv --verbose=2 "${APP}" 2>&1 | grep -E "Authority|TeamIdentifier|flags|Timestamp"
      - name: Notarize and staple app
        env:
          AID: ${{ secrets.APPLE_ID }}
          APW: ${{ secrets.APPLE_APP_PASSWORD }}
          TID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          ditto -c -k --keepParent "${APP}" app-notarize.zip
          xcrun notarytool submit app-notarize.zip --apple-id "$AID" --password "$APW" --team-id "$TID" --wait --timeout 60m --output-format json | tee notary-app.json
          grep -Eq '"status" *: *"Accepted"' notary-app.json || { ID=$(sed -E 's/.*"id":"([^"]*)".*/\1/' notary-app.json); xcrun notarytool log "$ID" --apple-id "$AID" --password "$APW" --team-id "$TID"; exit 1; }
          xcrun stapler staple "${APP}"
          xcrun stapler validate "${APP}"
          spctl -a -vvv -t exec "${APP}" 2>&1 | tee spctl-app.txt
      - name: Create dmg
        run: |
          brew install create-dmg
          CREATE_DMG="$(readlink -f "$(command -v create-dmg)")"
          sed -i -e 's/MAXIMUM_UNMOUNTING_ATTEMPTS=3/MAXIMUM_UNMOUNTING_ATTEMPTS=7/' "$CREATE_DMG"
          DMG="adoluna-support-${VERSION}-universal.dmg"
          create-dmg --volname "Adoluna Support" --icon "${APP}" 200 190 --hide-extension "${APP}" --window-size 800 400 --app-drop-link 600 185 "$DMG" "${APP}"
          echo "DMG=$DMG" >> "$GITHUB_ENV"
      - name: Sign, notarize and staple dmg
        env:
          AID: ${{ secrets.APPLE_ID }}
          APW: ${{ secrets.APPLE_APP_PASSWORD }}
          TID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          codesign --force --timestamp -s "$IDENTITY" "$DMG" -vvv
          xcrun notarytool submit "$DMG" --apple-id "$AID" --password "$APW" --team-id "$TID" --wait --timeout 60m --output-format json | tee notary-dmg.json
          grep -Eq '"status" *: *"Accepted"' notary-dmg.json || exit 1
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG" 2>&1 | tee stapler-dmg.txt
          spctl -a -vvv -t open --context context:primary-signature "$DMG" 2>&1 | tee spctl-dmg.txt
          shasum -a 256 "$DMG" | tee -a spctl-dmg.txt
      - name: Cleanup keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/adoluna.keychain-db" || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: signing-report
          path: |
            notary-*.json
            spctl-*.txt
            stapler-*.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: adoluna-support-macos-universal
          path: ${{ env.DMG }}
          retention-days: 30
