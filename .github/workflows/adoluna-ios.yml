# Adoluna Support iOS controller: TestFlight only (manual trigger).
# Never submits for App Store review and never adds testers.
# Secrets: IOS_DIST_P12_BASE64, IOS_DIST_P12_PASSWORD, IOS_PROFILE_BASE64,
#          ASC_KEY_ID, ASC_ISSUER_ID, ASC_PRIVATE_KEY.
name: adoluna-ios

on:
  workflow_dispatch:
    inputs:
      upload:
        description: upload the .ipa to TestFlight (true/false)
        default: "false"
        required: true

permissions:
  contents: read

concurrency:
  group: adoluna-ios
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.24.5"
  BRIDGE_FLUTTER_VERSION: "3.22.3"
  RUST_VERSION: "1.81"
  BRIDGE_RUST_VERSION: "1.75"
  CARGO_EXPAND_VERSION: "1.0.95"
  FLUTTER_RUST_BRIDGE_VERSION: "1.80.1"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  BUNDLE_ID: com.adoluna.support
  TEAM_ID: W8CX44A9ZR
  PROFILE_NAME: Adoluna Support App Store

jobs:
  bridge:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - run: |
          sudo apt-get update -y
          sudo apt-get install -y clang cmake curl gcc git g++ libclang-dev libgtk-3-dev llvm-dev nasm ninja-build pkg-config wget
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.BRIDGE_RUST_VERSION }}
          components: rustfmt
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ env.BRIDGE_FLUTTER_VERSION }}
          cache: true
      - name: Generate flutter-rust-bridge
        run: |
          cargo install cargo-expand --version ${{ env.CARGO_EXPAND_VERSION }} --locked
          cargo install flutter_rust_bridge_codegen --version ${{ env.FLUTTER_RUST_BRIDGE_VERSION }} --features "uuid" --locked
          sed -i -e 's/extended_text: 14.0.0/extended_text: 13.0.0/g' flutter/pubspec.yaml
          pushd flutter && flutter pub get && popd
          ~/.cargo/bin/flutter_rust_bridge_codegen --rust-input ./src/flutter_ffi.rs --dart-output ./flutter/lib/generated_bridge.dart --c-output ./flutter/macos/Runner/bridge_generated.h
          cp ./flutter/macos/Runner/bridge_generated.h ./flutter/ios/Runner/bridge_generated.h
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bridge-artifact
          path: |
            ./src/bridge_generated.rs
            ./src/bridge_generated.io.rs
            ./flutter/lib/generated_bridge.dart
            ./flutter/lib/generated_bridge.freezed.dart
            ./flutter/macos/Runner/bridge_generated.h
            ./flutter/ios/Runner/bridge_generated.h

  testflight:
    needs: [bridge]
    runs-on: macos-26
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      - name: Toolchain
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          xcodebuild -version
          rustc --version || true
          brew install nasm yasm

      - name: Install flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Patch flutter
        run: |
          cd "$(dirname "$(dirname "$(which flutter)")")"
          if [[ "3.24.5" == "${{ env.FLUTTER_VERSION }}" ]]; then
            git apply "${{ github.workspace }}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff"
          fi

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        run: |
          if ! "$VCPKG_ROOT/vcpkg" install --triplet arm64-ios --x-install-root="$VCPKG_ROOT/installed"; then
            find "$VCPKG_ROOT" -name "*.log" | while read -r log; do
              echo "$log:"
              echo "======"
              tail -n 80 "$log" || true
              echo "======"
            done
            exit 1
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-apple-ios
          components: rustfmt

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: adoluna-ios-lib-cache
          key: aarch64-apple-ios

      - name: Build rustdesk lib
        run: |
          rustup target add aarch64-apple-ios
          cargo build --locked --features flutter,hwcodec --release --target aarch64-apple-ios --lib
          test -f target/aarch64-apple-ios/release/liblibrustdesk.a

      - name: App Store Connect API key file
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s\n' "$ASC_PRIVATE_KEY" > "$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 "$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8"

      - name: Signing keychain + provisioning profile
        env:
          P12: ${{ secrets.IOS_DIST_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: |
          set -e
          KC="$RUNNER_TEMP/signing.keychain-db"
          KCPW=$(uuidgen)
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          security import "$RUNNER_TEMP/dist.p12" -k "$KC" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security -f pkcs12
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCPW" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/dist.p12"
          security find-identity -v -p codesigning "$KC" | grep -c "Apple Distribution"
          echo "$PROFILE" | base64 --decode > "$RUNNER_TEMP/support.mobileprovision"
          UUID=$(security cms -D -i "$RUNNER_TEMP/support.mobileprovision" | plutil -extract UUID raw -)
          for d in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$d"
            cp "$RUNNER_TEMP/support.mobileprovision" "$d/$UUID.mobileprovision"
          done
          echo "profile $UUID"

      - name: Flutter iOS assemble (unsigned)
        run: |
          pushd flutter
          flutter pub get
          flutter build ios --release --no-codesign --build-number="$((112 + ${{ github.run_number }} - 1))" --build-name="1.5.1"
          popd

      - name: Archive (Release, Apple Distribution)
        run: |
          set -o pipefail
          BUILD=$((112 + ${{ github.run_number }} - 1))
          echo "BUILD=$BUILD" >> "$GITHUB_ENV"
          xcodebuild archive \
            -workspace flutter/ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/AdolunaSupport.xcarchive" \
            CURRENT_PROJECT_VERSION=$BUILD \
            MARKETING_VERSION=1.5.1 \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" | tail -n 50

      - name: Export .ipa
        run: |
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/AdolunaSupport.xcarchive" \
            -exportOptionsPlist flutter/ios/exportOptions.plist \
            -exportPath "$RUNNER_TEMP/ipa" | tail -n 30
          ls -l "$RUNNER_TEMP/ipa"
          IPA=$(ls "$RUNNER_TEMP"/ipa/*.ipa | head -1)
          unzip -q -o "$IPA" -d "$RUNNER_TEMP/ipa-check"
          APP=$(ls -d "$RUNNER_TEMP"/ipa-check/Payload/*.app)
          codesign -dvv "$APP" 2>&1 | grep -E "Authority=Apple Distribution|TeamIdentifier"
          plutil -p "$APP/Info.plist" | grep -E "CFBundleIdentifier|CFBundleDisplayName|CFBundleShortVersionString|CFBundleVersion"

      - name: Upload to TestFlight (no review submission, no testers)
        if: inputs.upload == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          IPA=$(ls "$RUNNER_TEMP"/ipa/*.ipa | head -1)
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          cp "$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8" "$HOME/.appstoreconnect/private_keys/"
          xcrun altool --upload-app -f "$IPA" -t ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" --output-format normal
          echo "Uploaded build $BUILD. Processing happens in App Store Connect > TestFlight."

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: adoluna-support-ios-ipa
          path: ${{ runner.temp }}/ipa/*.ipa
          retention-days: 14

      - name: Clean up signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -rf "$RUNNER_TEMP/asc" "$HOME/.appstoreconnect" "$RUNNER_TEMP/support.mobileprovision" "$RUNNER_TEMP/ipa-check"
