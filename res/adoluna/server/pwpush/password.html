<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>固定密码推送 · Adoluna Support Admin</title>
<style>body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#f5f7fa;margin:0;color:#1f2d3d}
.c{max-width:620px;margin:40px auto;background:#fff;border-radius:10px;padding:28px 32px;box-shadow:0 2px 12px rgba(0,0,0,.08)}
h1{font-size:20px;margin:0 0 6px}p.s{color:#606266;font-size:13px;margin:0 0 20px}label{display:block;font-size:14px;margin:16px 0 6px;font-weight:600}
input,textarea{width:100%;box-sizing:border-box;padding:9px 11px;border:1px solid #dcdfe6;border-radius:6px;font-size:14px}
button{margin-top:18px;background:#1f6feb;color:#fff;border:0;border-radius:6px;padding:10px 18px;font-size:14px;cursor:pointer}
button.g{background:#909399}.st{background:#f4f4f5;border-radius:6px;padding:12px 14px;font-size:13px;line-height:1.8}
.msg{margin-top:14px;font-size:14px}.err{color:#d03050}.ok{color:#18a058}a{color:#1f6feb}</style></head><body><div class="c">
<h1>固定密码推送</h1><p class="s">设置所有设备共用的固定密码。设备在线时约 15 秒内生效，离线设备下次上线时生效。服务器只保存密码的哈希，不保存明文。需要 76 版及以后的客户端。</p>
<div class="st" id="st">读取中…</div>
<label>新的固定密码（8–64 位）</label><input id="p1" type="password" autocomplete="new-password">
<label>再输入一次</label><input id="p2" type="password" autocomplete="new-password">
<label>只推送到这些设备 ID（每行一个；留空 = 推送到所有设备）</label><textarea id="t" rows="4" placeholder="例如 1226906882"></textarea>
<button id="save">保存并推送</button> <button class="g" id="savet">只保存设备范围</button> <a href="./" style="margin-left:12px">返回后台</a>
<div class="msg" id="m"></div></div>
<script>
const tok=localStorage.getItem("access_token"),A="/_admin/adoluna-api/password",$=i=>document.getElementById(i);
function show(s){$("st").innerHTML="当前版本：<b>"+(s.version||0)+"</b>"+(s.version?"　最后修改："+s.updated_at:"（还没有设置过）")+"<br>推送范围："+(s.targets.length?s.targets.join("、"):"所有设备");$("t").value=s.targets.join("\n")}
function msg(t,ok){$("m").className="msg "+(ok?"ok":"err");$("m").textContent=t}
async function call(body){const r=await fetch(A,{method:body?"POST":"GET",headers:{"api-token":tok||"","Content-Type":"application/json"},body:body?JSON.stringify(body):undefined});const j=await r.json();if(!r.ok)throw new Error(j.error||r.status);return j}
if(!tok){$("st").textContent="请先在本机登录后台（管理员账号），再打开此页。"}else call().then(show).catch(e=>{$("st").textContent="无法读取："+e.message});
const tg=()=>$("t").value.split(/[\s,，]+/).filter(Boolean);
$("save").onclick=async()=>{const a=$("p1").value,b=$("p2").value;if(a.length<8)return msg("密码至少 8 位");if(a!==b)return msg("两次输入不一致");
if(!confirm("确定把固定密码推送到"+(tg().length?tg().length+" 台指定设备":"所有设备")+"吗？"))return;
try{show(await call({password:a,targets:tg()}));$("p1").value=$("p2").value="";msg("已保存，在线设备约 15 秒内更新。",1)}catch(e){msg("保存失败："+e.message)}};
$("savet").onclick=async()=>{try{show(await call({targets:tg()}));msg("推送范围已保存。",1)}catch(e){msg("保存失败："+e.message)}};
</script></body></html>
