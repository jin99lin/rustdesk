# Adoluna Support - macOS universal (arm64 + x86_64) dmg. Derived from RustDesk 1.5.0 flutter-build.yml.
# Manual trigger only, no release upload. Signing + notarization run only when MACOS_P12_BASE64 is set.
# Secrets: MACOS_P12_BASE64, MACOS_P12_PASSWORD, APPLE_ID, APPLE_APP_PASSWORD, APPLE_TEAM_ID
name: adoluna-macos

on:
  workflow_dispatch:

env:
  VERSION: "1.5.0"
  RUST_VERSION: "1.75"
  MAC_RUST_VERSION: "1.81"
  CARGO_EXPAND_VERSION: "1.0.95"
  FLUTTER_RUST_BRIDGE_VERSION: "1.80.1"
  BRIDGE_FLUTTER_VERSION: "3.22.3"
  FLUTTER_VERSION: "3.24.5"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  APP: "AdolunaSupport.app"
  MACOS_P12_BASE64: "${{ secrets.MACOS_P12_BASE64 }}"

jobs:
  bridge:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive
      - run: |
          sudo apt-get update -y
          sudo apt-get install -y clang cmake curl gcc git g++ libclang-dev libgtk-3-dev llvm-dev nasm ninja-build pkg-config wget
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: "rustfmt"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ env.BRIDGE_FLUTTER_VERSION }}
          cache: true
      - run: |
          cargo install cargo-expand --version ${{ env.CARGO_EXPAND_VERSION }} --locked
          cargo install flutter_rust_bridge_codegen --version ${{ env.FLUTTER_RUST_BRIDGE_VERSION }} --features "uuid" --locked
          sed -i -e 's/extended_text: 14.0.0/extended_text: 13.0.0/g' flutter/pubspec.yaml
          pushd flutter && flutter pub get && popd
          ~/.cargo/bin/flutter_rust_bridge_codegen --rust-input ./src/flutter_ffi.rs --dart-output ./flutter/lib/generated_bridge.dart --c-output ./flutter/macos/Runner/bridge_generated.h
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bridge-artifact
          path: |
            ./src/bridge_generated.rs
            ./src/bridge_generated.io.rs
            ./flutter/lib/generated_bridge.dart
            ./flutter/lib/generated_bridge.freezed.dart
            ./flutter/macos/Runner/bridge_generated.h

  build:
    needs: bridge
    strategy:
      fail-fast: true
      matrix:
        job:
          - { target: x86_64-apple-darwin, os: macos-15-intel, arch: x86_64, extra: "" }
          - { target: aarch64-apple-darwin, os: macos-14, arch: aarch64, extra: "--screencapturekit" }
    runs-on: ${{ matrix.job.os }}
    steps:
      - uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive
      - name: Install build runtime
        run: |
          brew install llvm
          command -v pkg-config || brew install pkg-config
          wget -q https://www.nasm.us/pub/nasm/releasebuilds/2.16.03/macosx/nasm-2.16.03-macosx.zip
          unzip -q nasm-2.16.03-macosx.zip && sudo cp nasm-2.16.03/nasm /usr/local/bin/nasm
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - name: Patch flutter
        run: |
          cd $(dirname $(dirname $(which flutter)))
          git apply ${{ github.workspace }}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff
          cd bin
          sed -i -e 's/_setFramesEnabledState(false);/\/\/_setFramesEnabledState(false);/g' ../packages/flutter/lib/src/scheduler/binding.dart
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.MAC_RUST_VERSION }}
          targets: ${{ matrix.job.target }}
          components: "rustfmt"
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: ${{ matrix.job.os }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./
      - uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false
      - name: Install vcpkg dependencies
        run: $VCPKG_ROOT/vcpkg install --x-install-root="$VCPKG_ROOT/installed"
      - name: Prefetch flutter packages (retry on network stall)
        timeout-minutes: 20
        run: |
          cd flutter
          for i in 1 2 3 4; do
            if perl -e 'alarm 240; exec @ARGV' flutter pub get; then exit 0; fi
            echo "pub get attempt $i failed/stalled, retrying"; sleep 15
          done
          exit 1
      - name: Build
        timeout-minutes: 120
        env:
          CARGO_NET_RETRY: "10"
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
        run: |
          # Same minimum version on both slices so the universal app has one LSMinimumSystemVersion.
          MIN_MACOS_VERSION="12.3"
          sed -i -e "s/MACOSX_DEPLOYMENT_TARGET\=[0-9]*.[0-9]*/MACOSX_DEPLOYMENT_TARGET=${MIN_MACOS_VERSION}/" build.py
          sed -i -e "s/platform :osx, '.*'/platform :osx, '${MIN_MACOS_VERSION}'/" flutter/macos/Podfile
          sed -i -e "s/osx_minimum_system_version = \"[0-9]*.[0-9]*\"/osx_minimum_system_version = \"${MIN_MACOS_VERSION}\"/" Cargo.toml
          sed -i -e "s/MACOSX_DEPLOYMENT_TARGET = [0-9]*.[0-9]*;/MACOSX_DEPLOYMENT_TARGET = ${MIN_MACOS_VERSION};/" flutter/macos/Runner.xcodeproj/project.pbxproj
          ./build.py --flutter --hwcodec --unix-file-copy-paste ${{ matrix.job.extra }}
          cd flutter/build/macos/Build/Products/Release
          ditto -c -k --keepParent "${APP}" ${{ github.workspace }}/app-${{ matrix.job.arch }}.zip
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-${{ matrix.job.arch }}
          path: app-${{ matrix.job.arch }}.zip

  universal:
    needs: build
    runs-on: macos-14
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: app-*
          merge-multiple: true
      - name: Merge into universal app (lipo every Mach-O that differs)
        run: |
          mkdir arm x64
          ditto -x -k app-aarch64.zip arm && ditto -x -k app-x86_64.zip x64
          cp -R "arm/${APP}" "${APP}"
          cd x64
          find "${APP}" -type f | while read -r f; do
            if file -b "$f" | grep -q 'Mach-O' && [ -f "../arm/$f" ]; then
              if ! lipo "../arm/$f" -verify_arch x86_64 2>/dev/null; then
                lipo -create "../arm/$f" "$f" -output "../$f"
              fi
            fi
          done
          cd ..
          lipo -info "${APP}/Contents/MacOS/AdolunaSupport" "${APP}/Contents/Frameworks/liblibrustdesk.dylib" || true
      - name: Ad-hoc re-sign (unsigned build, fixes FlutterMacOS Team ID mismatch)
        if: env.MACOS_P12_BASE64 == ''
        run: |
          xattr -cr "${APP}"
          codesign --remove-signature "${APP}" || true
          find "${APP}/Contents/Frameworks" -depth \( -name "*.framework" -o -name "*.dylib" \) -exec codesign --force --sign - {} \;
          codesign --force --deep --sign - "${APP}"
          codesign -v --deep --strict --verbose=2 "${APP}"
          codesign -dv "${APP}" 2>&1 | grep -E "Signature|TeamIdentifier"
      - name: Import signing certificate
        if: env.MACOS_P12_BASE64 != ''
        uses: apple-actions/import-codesign-certs@253ddeeac23f2bdad1646faac5c8c2832e800071 # v1
        with:
          p12-file-base64: ${{ secrets.MACOS_P12_BASE64 }}
          p12-password: ${{ secrets.MACOS_P12_PASSWORD }}
          keychain: adoluna
      - name: Codesign app
        if: env.MACOS_P12_BASE64 != ''
        run: |
          security default-keychain -s adoluna.keychain
          security unlock-keychain -p "${{ secrets.MACOS_P12_PASSWORD }}" adoluna.keychain
          IDENTITY=$(security find-identity -v -p codesigning adoluna.keychain | grep -m1 "Developer ID Application" | sed -E 's/.*"(.*)"/\1/')
          echo "Signing with: $IDENTITY"
          bash ./.github/scripts/sign-macos-app.sh "${APP}" "$IDENTITY" ./flutter/macos/Runner/Release.entitlements
          echo "IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
      - name: Create dmg
        run: |
          brew install create-dmg
          CREATE_DMG="$(readlink -f "$(command -v create-dmg)")"
          sed -i -e 's/MAXIMUM_UNMOUNTING_ATTEMPTS=3/MAXIMUM_UNMOUNTING_ATTEMPTS=7/' "$CREATE_DMG"
          SUFFIX=$([ -n "$MACOS_P12_BASE64" ] && echo "" || echo "-unsigned")
          DMG="adoluna-support-${VERSION}-universal${SUFFIX}.dmg"
          create-dmg --volname "Adoluna Support" --icon "${APP}" 200 190 --hide-extension "${APP}" --window-size 800 400 --app-drop-link 600 185 "$DMG" "${APP}"
          echo "DMG=$DMG" >> "$GITHUB_ENV"
      - name: Sign, notarize and staple dmg
        if: env.MACOS_P12_BASE64 != ''
        run: |
          codesign --force --timestamp --options runtime -s "$IDENTITY" "$DMG" -vvv
          xcrun notarytool submit "$DMG" --apple-id "${{ secrets.APPLE_ID }}" --password "${{ secrets.APPLE_APP_PASSWORD }}" --team-id "${{ secrets.APPLE_TEAM_ID }}" --wait
          xcrun stapler staple "$DMG"
          spctl -a -t open --context context:primary-signature -vv "$DMG"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: adoluna-support-macos-universal
          path: ${{ env.DMG }}
          retention-days: 30
